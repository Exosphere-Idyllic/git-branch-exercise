<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 60px 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            animation: slideIn 0.8s ease-out;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 20px;
            animation: fadeInDown 1s ease-out;
        }

        p {
            color: #666;
            font-size: 1.1em;
            line-height: 1.8;
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        /* Animaciones */
        @keyframes slideIn {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Efecto hover en el contenedor */
        .container:hover {
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }

        h1:hover {
            color: #667eea;
            transition: color 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Bienvenido!</h1>
        <p>Te damos la más cordial bienvenida a nuestro sitio web. Estamos felices de tenerte aquí. Esta página ha sido creada con HTML moderno, CSS avanzado y animaciones suaves para brindarte la mejor experiencia de usuario. ¡Que disfrutes navegando!</p>
    </div>
</body>
</html>
